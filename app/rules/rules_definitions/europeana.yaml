SOURCE: EUROPEANA

FIELDS:
  REQUIRED:
    - about
    - proxies[].dcTitle
    - aggregations[].edmIsShownBy

MAPPING:

  id: 
    PATH: about
    STRATEGY: add_europeana_base_url

  title: 
    PATH: proxies[].dcTitle
    STRATEGY: map_language
  
  description:
    PATH: proxies[].dcDescription
    STRATEGY: map_language

  object_type: 
    PATH: proxies[].dcType
    STRATEGY: map_language

  material: 
    PATH: proxies[].dcTermsMedium
    STRATEGY: resolve_concept

  collections:
    id: 
      PATH: null

    title: 
      PATH: null

    description: 
      PATH: null

  representation: 
    PATH: europeanaAggregation.edmPreview

  depiction: 
    PATH: null

  part_of: 
    PATH: null

  language: 
    PATH: proxies[].dcLanguage
    STRATEGY: map_language

  reference: 
    PATH: europeanaAggregation.edmLandingPage

  creation_date: 
    PATH: proxies[].dctermsCreated
    STRATEGY: map_language_extract_first_remove_hashtag

  destruction_date: 
    PATH: null

  place_of_creation: 
    name:
      PATH: proxies[].dctermsSpatial
      STRATEGY: resolve_place_name
    
    latitude:
      PATH: proxies[].dctermsSpatial
      STRATEGY: resolve_place_lat
      
    longitude:
      PATH: proxies[].dctermsSpatial
      STRATEGY: resolve_place_long    

  place_of_destruction: 
    name:
      PATH: null
    
    latitude:
      PATH: null
      
    longitude:
      PATH: null

  created_by:
    id: 
      PATH: proxies[].dcCreator
      STRATEGY: resolve_europeana_creator_id

    name: 
      PATH: proxies[].dcCreator
      STRATEGY: resolve_europeana_creator_name

  digital_representation: 
    PATH: aggregations[].edmIsShownBy
    STRATEGY: extract_first