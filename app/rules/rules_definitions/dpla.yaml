SOURCE: DPLA

FIELDS:
  REQUIRED:
    - "@id"
    - sourceResource.title
    - object

MAPPING:
  id: 
    PATH: "@id"

  title: 
    PATH: sourceResource.title
  
  description:
    PATH: sourceResource.description[]
    STRATEGY: extract_first

  object_type: 
    PATH: sourceResource.type

  material: 
    PATH: sourceResource.physicalMedium

  collections:
    id: 
      PATH: sourceResource.collection[].@id

    title: 
      PATH: sourceResource.collection[].title

    description: 
      PATH: sourceResource.collection[].description

  representation: 
    PATH: object

  depiction: 
    PATH: null

  part_of: 
    PATH: null

  language: 
    PATH: sourceResource.language[].name

  reference: 
    PATH: null

  creation_date: 
    PATH: sourceResource.date[].begin
    STRATEGY: extract_first

  destruction_date: 
    PATH: sourceResource.date[].end
    STRATEGY: extract_first

  place_of_creation: 
    name:
      PATH: sourceResource.spatial[].name
      STRATEGY: extract_first
    
    latitude:
      PATH: null
    
    longitude:
      PATH: null

  place_of_destruction:
    name:
      PATH: null
    
    latitude:
      PATH: null
    
    longitude:
      PATH: null

  created_by:
    id: 
      PATH: null

    name: 
      PATH: sourceResource.creator

  digital_representation: 
    PATH: object