<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heritage Metadata Transformation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <main class="container">
        <h1>Heritage Metadata Transformation Pipeline</h1>

        <p>This application transforms cultural heritage metadata into RDF according to the Heritage Digital Twins Ontology.</p>

        <form id="transform-form">
            <div class="col-md-3 mb-3">
                <label class="form-label" for="input-file">Input file</label>
                <input type="file" class="form-control" id="input-file" accept=".json,application/json" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label" for="input-format">Output Format</label>
                <select class="form-select" id="input-format">
                    <option value="xml">XML</option>
                    <option value="turtle">Turtle</option>
                </select>
            </div>
            <button id="submit-button" type="submit" class="btn btn-primary">Transform</button>
        </form>


        <p id="error-message" class="error-message" role="alert" hidden></p>

        <div id="result-card" class="card mt-4 d-none shadow-sm">
            <div class="card-header">
                Results
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="card text-center h-100">
                            <div class="card-header">
                                Source
                            </div>
                            <div class="card-body" id="metric-source">-</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center h-100">
                            <div class="card-header">
                                Duration
                            </div>
                            <div class="card-body" id="metric-duration">-</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center h-100">
                            <div class="card-header">
                                Records processed
                            </div>
                            <div class="card-body" id="metric-processed">-</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center h-100">
                            <div class="card-header">
                                Valid records
                            </div>
                            <div class="card-body" id="metric-valid">-</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center h-100">
                            <div class="card-header">
                                Invalid records
                            </div>
                            <div class="card-body" id="metric-invalid">-</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center h-100">
                            <div class="card-header">
                                Triples generated
                            </div>
                            <div class="card-body" id="metric-triples">-</div>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                <button id="class-breakdown-toggle" class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#class-breakdown" aria-expanded="false" aria-controls="class-breakdown" hidden>
                    Show items per class
                </button>
                <div class="collapse mt-2" id="class-breakdown">
                    <ul id="class-breakdown-list" class="list-group"></ul>
                </div>
                </div>
            </div>
            <div class="card-footer">
                <button id="view-button" type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#rdfModal">
                    View
                </button>
                <button id="download-button" type="button" class="btn btn-primary">
                    Download
                </button>
            </div>
        </div>

        <div class="modal fade" id="rdfModal" tabindex="-1">
            
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Generated RDF</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">
                <pre class="bg-body-tertiary border rounded p-3 mb-0"><code id="rdfContent"></code></pre>
            </div>

            <div class="modal-footer">
                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
    </main>
    <script src="/static/js/script.js"></script>

</body>
</html>
